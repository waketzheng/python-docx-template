# As per the example on https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions
name: Python codestyling
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - uses: astral-sh/setup-uv@v6
    - name: Install dependencies
      run: uv sync --all-extras --all-groups
    - name: Lint with ruff
      run: |
        # stop the build if there are code styling problems. The GitHub editor is 127 chars wide.
        uv run ruff format --check
        uv run ruff check
    - name: Check type hints
      run: uv run mypy .

  lint_by_pdm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Setup pdm
        run: |
          pip install --upgrade pip
          pip install pipx
          pipx ensurepath
          pipx install pdm
      - name: Install dependencies
        run: pdm sync --group :all
      - name: Lint and check
        run: |
          pdm run ruff format --check
          pdm run ruff check
          pdm run mypy .
      - name: Build dist
        run: |
          pdm build
          pdm run twine check dist/*

  lint_by_poetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Setup poetry
        run: |
          pip install --upgrade pip
          pip install pipx
          pipx ensurepath
          pipx install poetry
      - name: Install dependencies
        run: |
          poetry install --all-extras --all-groups
          poetry run python -m pip install --upgrade pip
          poetry run pip install --group dev
      - name: Lint and check
        run: |
          poetry run ruff format --check
          poetry run ruff check
          poetry run mypy .
      - name: Build dist
        run: |
          poetry build --clean
          poetry run twine check dist/*

  no_tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install --group dev -e ".[subdoc,docs]"
      - name: Lint and check
        run: |
          .venv/bin/ruff format --check
          .venv/bin/ruff check
          .venv/bin/mypy .
      - name: Build dist
        run: |
          .venv/bin/pip install --upgrade build
          .venv/bin/python -m build
          .venv/bin/twine check dist/*

  requirements.txt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r pyproject.toml --group dev
          pip install -e .
      - name: Lint and check
        run: |
          ruff format --check
          ruff check
          mypy .
      - name: Build dist
        run: |
          pip install --upgrade build
          python -m build
          twine check dist/*
